<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasir AI Scanner - Deep Analysis</title>
<style>
body{font-family:system-ui;background:#0b1220;color:#fff;padding:15px}
.card{background:#151e32;padding:15px;border-radius:15px;margin-top:15px;border:1px solid #243056}
input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;font-size:16px}
button{background:#3b82f6;color:#fff;font-weight:bold}
.up{color:#22c55e;font-weight:bold}.down{color:#ef4444;font-weight:bold}
.badge{padding:4px 8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<h2>📈 Nasir AI Scanner - Deep</h2>
<p style="color:#94a3b8">100% nahi, lekin 7 indicators se Deep Analysis</p>

<div class="card">
<label>Coin / Symbol</label>
<input id="symbol" value="BTCUSDT">
<select id="interval">
<option value="15m">15 Minute</option>
<option value="1h">1 Hour</option>
<option value="4h">4 Hour</option>
<option value="1d">1 Day</option>
</select>
<button onclick="startScan()">🔍 DEEP SCAN START</button>
</div>

<div id="output" class="card" style="display:none"></div>

<script>
async function startScan(){
 const sym = document.getElementById('symbol').value.toUpperCase();

 out.style.display='block';
 out.innerHTML='⏳ Binance se live data le raha hun...';

 try{
  const url = `https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${intv}&limit=100`;
  const res = await fetch(url);

  const highs = data.map(d=>parseFloat(d[2]));
  const lows = data.map(d=>parseFloat(d[3]));
  const volumes = data.map(d=>parseFloat(d[5]));
  
  const lastClose = closes[closes.length-1];
  
  // RSI Calculate
  const rsi = calcRSI(closes,14);
  // EMA
  const ema50 = calcEMA(closes,50);
  const ema200 = calcEMA(closes,100);
  // MACD simple
  const macdUp = closes[closes.length-1] > calcEMA(closes,12) - calcEMA(closes,26);
  
  // Candle Pattern
  let pattern = "Normal";
  const last = data[data.length-1];
  const open = parseFloat(last[1]), close = parseFloat(last[4]), high = parseFloat(last[2]), low = parseFloat(last[3]);
  if(close > open && (close-open) > (high-low)*0.6) pattern = "Bullish Engulfing - UP";
  else if(open > close && (open-close) > (high-low)*0.6) pattern = "Bearish Engulfing - DOWN";
  else if((high-low) > Math.abs(open-close)*3) pattern = "Doji / Rejection";
  else if(close > open) pattern = "Hammer - UP";
  else pattern = "Weak - DOWN";

  let score = 0;
  if(rsi < 35) score+=25; else if(rsi < 50) score+=10; else if(rsi > 70) score-=25;
  if(lastClose > ema50) score+=25; else score-=25;
  if(lastClose > ema200) score+=20; else score-=10;
  if(macdUp) score+=15; else score-=15;
  if(pattern.includes("UP")) score+=15; else if(pattern.includes("DOWN")) score-=15;

  let finalSignal = score >= 40 ? "UP 🚀 STRONG BUY" : score >= 10 ? "UP ↗️ Weak Buy" : score <= -40 ? "DOWN 🔻 STRONG SELL" : score <= -10 ? "DOWN ↘️ Weak Sell" : "SIDEWAYS / WAIT";
  let cls = score > 0 ? "up" : "down";

  out.innerHTML = `
  <h3>${sym} - ${intv}</h3>
  <p>Price: <b>$${lastClose}</b></p>
  <p>RSI (14): <b>${rsi.toFixed(2)}</b> ${rsi>70?'Overbought':rsi<30?'Oversold':'Neutral'}</p>
  <p>EMA 50: ${ema50.toFixed(2)} | EMA 200: ${ema200.toFixed(2)}</p>
  <p>MACD: ${macdUp?'Bullish':'Bearish'}</p>
  <p>Pattern: <b>${pattern}</b></p>
  <p>Volume: ${volumes[volumes.length-1
